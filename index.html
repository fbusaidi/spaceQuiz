<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game</title>
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <div class="startScreen">
            <img id="logo" src="logo.png" alt="PDO Logo">
            <h1>هيا بنا لنختبر معرفتك بالفلك</h1>
            <h1>Lets test your space knowledge</h1>
            <br>
            <p>Enter your name | قم بإدخال اسمك</p>
            <input type="text" id="playerName" placeholder="Your name">
            <br>
            <button id="arButton">العربية</button>
            <button id="enButton">English</button>
        </div>

        <div class="quizScreen"> 
            <div class="quizHeader">

                <img id="logo" src="logo.png" alt="PDO Logo">

                <div class="headerRight">
                    <p id="score"></p>
                    <button id="submit">Submit | إنهاء</button>
                </div>
            </div>

            <p id="timer"></p>
            <h2 id="question"></h2>
            <div id="answers"></div>
        
            <button id="nextButton">Next | التالي</button>
        </div>

        <div class="leaderboard">
            <h1>Leaderboard | لوحة الصدارة</h1>
            <div id="ranking">
                <div id="rankingHeader">
                    <p>المركز</p>
                    <p>الاسم</p>
                    <p>النقاط</p>
                </div>
                <div class="rankingRow">
                    <p>1</p>
                    <p>Falak Al Busaidi</p>
                    <p>10000</p>
                </div>
            </div>
            <div id="myScore">
                <p>Your Score | نتيجتك</p>
                <p id="finalScore"></p>
                <button id="playAgain">Play again | العب مجددا</button>
            </div>
        </div>

        <script src="questions.js"></script>
        <script src="script.js"></script>
    </body>
</html>
