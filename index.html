<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Game</title>
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <div class="startScreen">
            <h1>هيا بنا لنختبر معرفتك بالفلك</h1>
            <h1>Lets test your space knowledge</h1>
            <br>
            <p>Enter your name | قم بإدخال اسمك</p>
            <input type="text" id="playerName" placeholder="Your name">
            <br>
            <button id="arButton">العربية</button>
            <button id="enButton">English</button>
        </div>

        <div class="quizScreen">
            <p id="score">Score: 0</p>
            <p id="questionNumber">Question 1 of 10</p>
            <h2 id="question"></h2>
            <div id="answers"></div>

            <button id="nextButton">Next</button>
        </div>

        <div class="leaderboard">
            <h1>leaderboard | لوحة الصدارة</h1>
            <div id="ranking">
                <div id="rankingHeader">
                    <p>المركز</p>
                    <p>الاسم</p>
                    <p>النقاط</p>
                </div>
                <div id="rankingRow">
                    <p>1</p>
                    <p>Falak</p>
                    <p>1000</p>
                </div>
            </div>
            <div id="myScore">
                <p>Your Score | نتيجتك</p>
                <p id="finalScore"></p>
                <button id="playAgain">Play again | العب مجددا</button>
            </div>
        </div>

        <script src="questions.js"></script>
        <script src="script.js"></script>
    </body>
</html>
